spring.application.name=Application

# JWT: the secret is a Base64 key of at least 32 bytes, never committed (e.g. openssl rand -base64 32).
nexus.security.jwt.secret=${NEXUS_JWT_SECRET:}
nexus.security.jwt.expiration=1h

# MongoDB: the database name is part of the URI. Spring Boot 4 reads spring.mongodb.* (spring.data.mongodb.uri is no longer applied).
spring.mongodb.uri=${NEXUS_MONGO_URI:mongodb://localhost:27017/nexusmarket}
