spring.application.name=Application

# JWT: the secret is a Base64 key of at least 32 bytes, never committed (e.g. openssl rand -base64 32).
nexus.security.jwt.secret=${NEXUS_JWT_SECRET:}
nexus.security.jwt.expiration=1h

# MongoDB: the database name is part of the URI. Spring Boot 4 reads spring.mongodb.* (spring.data.mongodb.uri is no longer applied).
spring.mongodb.uri=${NEXUS_MONGO_URI:mongodb://localhost:27017/nexusmarket}

# Create the indexes declared on the @Document classes (@Indexed, @CompoundIndex) at startup. Spring Boot 4.1.1
# keeps this property under spring.data.mongodb (unlike the connection URI, which moved to spring.mongodb).
spring.data.mongodb.auto-index-creation=true

# Initial administrator, created at startup only when no administrator exists. Leave both unset to skip it.
nexus.seed.admin.email=${NEXUS_ADMIN_EMAIL:}
nexus.seed.admin.password=${NEXUS_ADMIN_PASSWORD:}
